<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Scaffold</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Project Scaffold</h1>
    <p class="subtitle">Your project is ready to go.</p>

    <section class="card">
      <h2>Configuration</h2>
      <dl id="config-list">
        <div>
          <dt>App Name</dt>
          <dd id="app-name">—</dd>
        </div>
        <div>
          <dt>Debug Mode</dt>
          <dd id="debug-mode">—</dd>
        </div>
        <div>
          <dt>API Key Configured</dt>
          <dd id="api-key">—</dd>
        </div>
      </dl>
    </section>

    <p class="hint">
      Edit values in <code>.env</code> and restart the server to see changes.
    </p>
  </main>
  <script src="app.js"></script>
</body>
</html>
