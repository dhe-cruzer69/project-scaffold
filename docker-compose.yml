services:
  ollama:
    image: ollama/ollama:latest
    container_name: ariex-ollama
    ports:
      # Bind to loopback only to avoid exposing the unauthenticated Ollama API
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    # Uncomment the block below when you have an NVIDIA GPU to give the
    # container access to the hardware.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama-data:
