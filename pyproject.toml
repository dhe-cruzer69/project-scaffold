[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arixcore"
version = "0.1.0"
description = "AriexCore model-fleet AI service layer under the `arx` package (src/ layout)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
cloud = [
    "openai>=1.40.0",
    "anthropic>=0.34.0",
]

[tool.setuptools.packages.find]
where = ["src"]

