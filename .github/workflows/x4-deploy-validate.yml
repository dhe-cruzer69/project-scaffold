name: X4 Deploy Validate

on:
  push:
    branches: [main, x4-deployment-ready]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build X4 image
        run: docker build -f x4/Dockerfile -t x4-arsenal:ci .
      - name: Start X4 container
        run: docker run -d --name x4-ci -p 8080:8080 x4-arsenal:ci
      - name: Wait for X4 health
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs x4-ci
          exit 1
      - name: Verify X4 status
        run: |
          curl -fsS http://127.0.0.1:8080/api/x4/status
      - name: Stop X4 container
        if: always()
        run: docker rm -f x4-ci || true
