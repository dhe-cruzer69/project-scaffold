name: X4 Arsenal CI

on:
  push:
    branches: [main, x4-beast-arsenal-mvp]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  x4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test tooling
        run: python -m pip install --upgrade pytest ruff
      - name: Compile X4
        run: python -m compileall -q x4 tests/x4
      - name: Lint X4
        run: ruff check x4 tests/x4
      - name: Test X4
        env:
          PYTHONPATH: .
        run: pytest -q tests/x4
